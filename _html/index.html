                        <div className={`p-8 rounded-3xl max-w-xl mx-auto space-y-6 shadow-xs border ${isNature ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-100/70 border-slate-300'}`}>

                            </div>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-2">
                                <a
                                    href={`tel:${template.contact.phone}`}

                                <a

                                    rel="noopener noreferrer"

                    </section>

                    <footer className="mt-auto bg-slate-900 text-slate-400 py-8 px-4 border-t border-slate-800 text-center text-sm">

                        <p className="text-xs text-slate-500 mt-1">พัฒนาด้วย Next.js 16 (App Router), TypeScript & Tailwind CSS v4</p>
                    </footer>

            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
